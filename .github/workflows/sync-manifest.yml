name: Sync Manifest (SMAPI, hosted read-modify-write)

on:
  workflow_dispatch:
    inputs:
      skill_id:
        description: "Skill-ID (leer = Secret ALEXA_SKILL_ID)"
        default: ""
      add_apl:
        description: "1 = APL-Interface ergaenzen (falls fehlt)"
        default: "1"
      endpoint_arn:
        description: "ARN der eigenen AWS-Lambda als Skill-Endpoint (leer = unveraendert lassen)"
        default: ""
      dry_run:
        description: "1 = nur aktuellen Zustand anzeigen, kein PUT"
        default: "0"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ASK CLI auth files
        run: |
          mkdir -p ~/.ask/scripts
          cp .github/ask/git-credential-helper ~/.ask/scripts/git-credential-helper
          cp .github/ask/ask-pre-push ~/.ask/scripts/ask-pre-push
          chmod +x ~/.ask/scripts/git-credential-helper ~/.ask/scripts/ask-pre-push
          echo "${{ secrets.ASK_AUTH_INFO }}" | base64 -d > ~/.ask/auth_info
          echo "${{ secrets.ASK_CLI_CONFIG }}" | base64 -d > ~/.ask/cli_config

      - name: Manifest lesen, APL ergaenzen, PUT, Build pollen
        env:
          SKILL_ID: ${{ inputs.skill_id || secrets.ALEXA_SKILL_ID }}
          ADD_APL: ${{ inputs.add_apl }}
          ENDPOINT_ARN: ${{ inputs.endpoint_arn }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          source ~/.ask/auth_info
          REFRESH=$(python3 -c 'import json,os;print(json.load(open(os.path.expanduser("~/.ask/cli_config")))["profiles"]["default"]["token"]["refresh_token"])')
          export ASK_REFRESH_TOKEN="${REFRESH}"
          TOKEN=$(curl -f -s --data-urlencode "grant_type=refresh_token" --data-urlencode "client_id=${ask_client_id}" --data-urlencode "client_secret=${ask_client_confirmation}" --data-urlencode "refresh_token=${REFRESH}" "${ask_lwa_api}"/auth/O2/token)
          ACCESS=$(echo "${TOKEN}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          BASE="${ask_smapi_api}/v1/skills/${SKILL_ID}/stages/development/manifest"
          HTTP=$(curl -s -D /tmp/h.txt -o /tmp/m.json -w "%{http_code}" -H "Authorization: Bearer ${ACCESS}" "${BASE}")
          echo "GET -> HTTP ${HTTP}"
          python3 - "$ADD_APL" "$ENDPOINT_ARN" "$DRY_RUN" <<'PYEOF'
          import json, sys
          m = json.load(open("/tmp/m.json"))
          manifest = m.get("manifest", {})
          need_put = False
          dry_run = sys.argv[3] == "1"
          cur_ep = manifest.get("apis", {}).get("custom", {}).get("endpoint", {})
          print("AKTUELLER Live-Endpoint (vor evtl. Aenderung):", json.dumps(cur_ep))
          print("DRY_RUN:", dry_run)
          interfaces = manifest.get("apis", {}).get("custom", {}).get("interfaces", [])
          names = [i.get("type") for i in interfaces]
          print("Interfaces:", names)
          if sys.argv[1] == "1" and "ALEXA_PRESENTATION_APL" not in names:
              interfaces.append({"type": "ALEXA_PRESENTATION_APL"})
              need_put = True
              print("APL ergaenzt")
          # supportedViewports: alle Profile setzen (Echo Show 5 = hubLandscapeSmall
          # fehlte im Default-Set -> Skalierung/Anzeigeprobleme auf Shows)
          VIEWPORTS = [
              {"mode": "HUB", "shape": "ROUND", "minWidth": 100, "maxWidth": 599, "minHeight": 100, "maxHeight": 599},
              {"mode": "HUB", "shape": "RECTANGLE", "minWidth": 960, "maxWidth": 1279, "minHeight": 100, "maxHeight": 599},
              {"mode": "HUB", "shape": "RECTANGLE", "minWidth": 960, "maxWidth": 1279, "minHeight": 600, "maxHeight": 959},
              {"mode": "HUB", "shape": "RECTANGLE", "minWidth": 1280, "maxWidth": 1920, "minHeight": 600, "maxHeight": 1279},
              {"mode": "HUB", "shape": "RECTANGLE", "minWidth": 1920, "maxWidth": 2560, "minHeight": 960, "maxHeight": 1279},
              {"mode": "HUB", "shape": "RECTANGLE", "minWidth": 960, "maxWidth": 1279, "minHeight": 1920, "maxHeight": 2560},
              {"mode": "TV", "shape": "RECTANGLE", "minWidth": 960, "maxWidth": 960, "minHeight": 540, "maxHeight": 540},
              {"mode": "MOBILE", "shape": "RECTANGLE", "minWidth": 600, "maxWidth": 959, "minHeight": 320, "maxHeight": 1920},
              {"mode": "MOBILE", "shape": "RECTANGLE", "minWidth": 960, "maxWidth": 1279, "minHeight": 320, "maxHeight": 1920},
              {"mode": "MOBILE", "shape": "RECTANGLE", "minWidth": 1280, "maxWidth": 1920, "minHeight": 320, "maxHeight": 1920},
          ]
          apl = next((i for i in interfaces if i.get("type") == "ALEXA_PRESENTATION_APL"), None)
          if apl is not None and apl.get("supportedViewports") != VIEWPORTS:
              apl["supportedViewports"] = VIEWPORTS
              need_put = True
              print("supportedViewports gesetzt/aktualisiert")
          endpoint_arn = sys.argv[2]
          if not endpoint_arn:
              print("endpoint_arn leer: Endpoint bleibt unveraendert (ARN aus deploy-aws-lambda.yml als Input setzen).")
          if endpoint_arn:
              custom = manifest.get("apis", {}).get("custom", {})
              ep = custom.get("endpoint", {})
              old = ep.get("uri", "(keine)")
              print("Endpoint: {} -> {}".format(old, endpoint_arn))
              if "arn:aws:lambda" in endpoint_arn:
                  custom["endpoint"] = {"uri": endpoint_arn}
                  print("  (ARN-Lambda: kein sslCertificateType, nur fuer HTTPS gueltig)")
              else:
                  custom["endpoint"] = {
                      "uri": endpoint_arn,
                      "sslCertificateType": "Wildcard",
                  }
              # Regionen-spezifische Endpoints (EU/NA/FE) ebenfalls umstellen:
              # Amazon liefert ueber regions.*.endpoint aus - wenn dort noch die
              # Hosted-Release_0-ARN steht, geht der echte Call nie an unsere Lambda.
              regions = custom.get("regions", {})
              for reg, rval in regions.items():
                  rep = rval.get("endpoint") or {}
                  r_old = rep.get("uri", "(keine)")
                  if r_old != endpoint_arn:
                      rval["endpoint"] = {"uri": endpoint_arn}
                      print("Region {}: {} -> {}".format(reg, r_old, endpoint_arn))
              if regions:
                  custom["regions"] = regions
              need_put = True
          if dry_run:
              need_put = False
          if need_put:
              json.dump(m, open("/tmp/m_new.json", "w"), ensure_ascii=False)
          else:
              open("/tmp/m_new.json", "w").write("")
              print("kein PUT noetig")
          PYEOF
          if [ -s /tmp/m_new.json ]; then
            ETAG=$(grep -i '^etag:' /tmp/h.txt | tr -d '\r' | cut -d' ' -f2)
            HTTP=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT -H "Authorization: Bearer ${ACCESS}" -H "Content-Type: application/json" -H "If-Match: ${ETAG}" --data-binary @/tmp/m_new.json "${BASE}")
            echo "PUT -> HTTP ${HTTP}"; head -c 400 /tmp/put.json; echo ""
            echo "=== Build-Status pollen (resource=manifest):"
            for i in $(seq 1 24); do
              sleep 10
              curl -s -H "Authorization: Bearer ${ACCESS}" "${ask_smapi_api}/v1/skills/${SKILL_ID}/status?resource=manifest" -o /tmp/status.json || true
              echo "  poll $i raw: $(python3 -c 'import json;d=json.load(open("/tmp/status.json"));import sys;print(json.dumps(d)[:600])' 2>/dev/null || cat /tmp/status.json | head -c 200)"
              S=$(python3 -c 'import json;d=json.load(open("/tmp/status.json"));r=d.get("manifest") or {};v=next(iter(r.values()),{});print((v.get("lastUpdateRequest") or {}).get("status") or "UNKNOWN")' 2>/dev/null || echo UNKNOWN)
              if [ "${S}" = "SUCCEEDED" ] || [ "${S}" = "FAILURE" ]; then
                echo "  -> Final: ${S}"
                break
              fi
            done
          fi
