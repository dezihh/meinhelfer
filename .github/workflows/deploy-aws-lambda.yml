name: Deploy AWS-Lambda (eigene Funktion statt Alexa-hosted)

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: "Lambda-Timeout in Sekunden (> 8 noetig, um hosted-Limit zu sprengen)"
        default: "30"

# Der aufgerufene Build-Workflow (lambda-zip.yml) deklariert contents: write
# (fuer das rollende "latest"-Release) - der Caller muss das erlauben.
permissions:
  contents: write

jobs:
  build:
    # Zip zentral bauen (dieselbe Build-Definition wie das Latest-Release)
    uses: ./.github/workflows/lambda-zip.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fuer skill.config.json)
        uses: actions/checkout@v4

      - name: Lambda-Zip aus dem Build-Job laden
        uses: actions/download-artifact@v4
        with:
          name: meinhelfer-alexa-lambda
          path: .

      - name: Skill-Grundwerte lesen (skill.config.json)
        run: |
          LOCALE=$(python3 -c 'import sys; sys.path.insert(0, "alexa/scripts"); import skill_config; print(skill_config.primary_locale())')
          echo "primaere Locale: ${LOCALE}"
          python3 alexa/scripts/skill_config.py --print-env "${LOCALE}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Funktion deployen (einfacher Weg, kein Layer-Stack)
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          TIMEOUT: ${{ inputs.timeout }}
          LAMBDA_ROLE: ${{ secrets.AWS_LAMBDA_ROLE }}
          SKILL_ID: ${{ secrets.ALEXA_SKILL_ID }}
        run: |
          set -e
          ZIP="meinhelfer-alexa-lambda.zip"
          [ -f "${ZIP}" ] || { echo "FEHLER: ${ZIP} fehlt (Build-Job?)"; exit 1; }
          ls -la "${ZIP}"

          # 0) Account-ID + Execution-Rolle sicherstellen (falls nicht via Secret gesetzt)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS Account: ${ACCOUNT_ID}"
          ROLE_ARN="${LAMBDA_ROLE}"
          if [ -z "${ROLE_ARN}" ]; then
            ROLE_NAME="${AWS_LAMBDA_ROLE_NAME:-meinhelfer-lambda-execution}"
            ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"
            if ! aws iam get-role --role-name "${ROLE_NAME}" >/dev/null 2>&1; then
              echo "Rolle ${ROLE_NAME} existiert nicht -> anlegen (Lambda-Basic-Execution-Trust)"
              aws iam create-role --role-name "${ROLE_NAME}" \
                --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":["lambda.amazonaws.com","iam.amazonaws.com"]},"Action":["sts:AssumeRole"]}]}'
            else
              echo "Rolle ${ROLE_NAME} existiert bereits"
            fi
          fi
          echo "Verwende Rolle: ${ROLE_ARN}"

          # 0b) CloudWatch-Logs-Policy fuer die Rolle sicherstellen (sonst keine Log-Streams)
          ROLE_NAME_FROM_ARN="${ROLE_ARN##*/}"
          LOG_POLICY='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["logs:CreateLogGroup","logs:CreateLogStream","logs:PutLogEvents","logs:DescribeLogStreams"],"Resource":"*"}]}'
          if aws iam put-role-policy --role-name "${ROLE_NAME_FROM_ARN}" --policy-name meinhelfer-lambda-logs --policy-document "${LOG_POLICY}"; then
            echo "Logs-Policy gesetzt auf ${ROLE_NAME_FROM_ARN}"
          else
            echo "!! put-role-policy fehlgeschlagen (Rechte des Deploy-Users?) - Logs bleiben aus"
          fi

          # 1) Funktion anlegen oder aktualisieren (Zip kommt aus dem Build-Job)
          if aws lambda get-function --function-name meinhelfer-alexa --query 'Configuration.FunctionName' --output text >/dev/null 2>&1; then
            echo "bestehende Funktion aktualisieren..."
            aws lambda update-function-code --function-name meinhelfer-alexa --zip-file "fileb://${ZIP}"
          else
            echo "Funktion neu anlegen..."
            # IAM-Propagation: Rolle ist gerade erst angelegt -> 6 Versuche mit 10s Pause
            for attempt in $(seq 1 6); do
              if aws lambda create-function --function-name meinhelfer-alexa \
                --runtime python3.14 --handler lambda_function.lambda_handler \
                --zip-file "fileb://${ZIP}" \
                --timeout "${TIMEOUT}" --memory-size 512 \
                --role "${ROLE_ARN}"
              then
                echo "create-function OK (Versuch ${attempt})"
                break
              else
                echo "create-function Versuch ${attempt} fehlgeschlagen (IAM-Propagation?)..."
                sleep 10
              fi
            done
            aws lambda get-function --function-name meinhelfer-alexa --query 'Configuration.FunctionName' --output text >/dev/null
          fi

          # 2) Timeout + Env setzen (als volles Operations-JSON, sicher für Sonderzeichen im Token)
          python3 -c 'import json,sys; t,u,g,s,n,a=sys.argv[1:]; timeout=int(t); open("/tmp/cfg.json","w").write(json.dumps({"FunctionName":"meinhelfer-alexa","Timeout":timeout,"MemorySize":512,"Environment":{"Variables":{"gateway_url":u,"gateway_token":g,"alexa_skill_id":s,"watchdog_delay":"5","gateway_timeout":str(max(9, timeout-3)),"skill_name":n,"assistant_name":a,"apl_exit_delay_ms":"90000"}}}))' "${TIMEOUT}" "${GATEWAY_URL}" "${GATEWAY_TOKEN}" "${SKILL_ID}" "${SKILL_NAME}" "${ASSISTANT_NAME}"
          for attempt in $(seq 1 6); do
            if aws lambda update-function-configuration --cli-input-json file:///tmp/cfg.json
            then
              echo "update-function-configuration OK (Versuch ${attempt})"
              break
            else
              echo "update-function-configuration Versuch ${attempt} fehlgeschlagen (Update in progress?)..."
              sleep 10
            fi
          done

          # 3) Alexa-Skill-Trigger (Invocation-Permission) setzen
          #     Ohne diesen Trigger lehnt Amazon den ARN-Endpoint ab:
          #     "The trigger setting for the Lambda ... is invalid" (SkillManifestError)
          #     Quelle: developer.amazon.com "Host a Custom Skill as an AWS Lambda Function"
          #     Vorhandene Permission zuerst entfernen, damit eine geaenderte
          #     ALEXA_SKILL_ID die alte Permission wirklich ersetzt statt an einem
          #     Statement-ID-Konflikt uebersprungen zu werden.
          if [ -z "${SKILL_ID}" ]; then
            echo "!! Secret ALEXA_SKILL_ID fehlt -> Alexa-Trigger kann nicht gesetzt werden"
            exit 1
          fi
          echo "Setze Alexa-Skill-Trigger (InvokePermission fuer ${SKILL_ID}) ..."
          aws lambda remove-permission \
            --function-name meinhelfer-alexa \
            --statement-id alexa-skill >/dev/null 2>&1 || true
          aws lambda add-permission \
            --function-name meinhelfer-alexa \
            --statement-id alexa-skill \
            --action lambda:InvokeFunction \
            --principal alexa-appkit.amazon.com \
            --event-source-token "${SKILL_ID}"
          echo "Alexa-Trigger OK"

          # 4) ARN ausgeben (Lambda-Funktions-ARN ist deterministisch aufgebaut)
          REGION="${AWS_DEFAULT_REGION:-eu-west-1}"
          ARN="arn:aws:lambda:${REGION}:${ACCOUNT_ID}:function:meinhelfer-alexa"
          echo "LAMBDA_ARN=${ARN}" >> "$GITHUB_ENV"
          echo "Lambda-ARN: ${ARN}"
          echo

      - name: Manifest-Hinweis
        run: |
          echo "=============================================="
          echo "NÄCHSTER SCHRITT (manuell, einmalig):"
          echo "  Skill-Manifest Endpoint auf eigene ARN umstellen:"
          echo "  LAMBDA_ARN=${LAMBDA_ARN}"
          echo "  (sync-manifest-Workflow oder Alexa-Console; Amazon prueft Endpoint-Fingerprint)"
          echo "=============================================="