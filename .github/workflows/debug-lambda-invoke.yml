name: Debug Lambda Invoke (GptQueryIntent)

on:
  workflow_dispatch:

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Lambda direkt aufrufen (Hausstatus-Query)
        env:
          SKILL_ID: ${{ secrets.ALEXA_SKILL_ID }}
        run: |
          python3 - <<'PYEOF' > /tmp/req.json
          import json, os
          sid = os.environ["SKILL_ID"]
          req = {
            "version": "1.0",
            "session": {
              "new": True,
              "sessionId": "amzn1.echo-api.session.debug-invoke-local",
              "application": {"applicationId": sid},
              "user": {"userId": "amzn1.account.debuginvoke"}
            },
            "context": {
              "System": {
                "application": {"applicationId": sid},
                "user": {"userId": "amzn1.account.debuginvoke"},
                "device": {
                  "supportedInterfaces": {
                    "ALEXA_PRESENTATION_APL": {"version": "1.0"}
                  }
                },
                "apiEndpoint": "https://api.eu.amazonalexa.com",
                "apiAccessToken": "test-token"
              }
            },
            "request": {
              "type": "IntentRequest",
              "requestId": "amzn1.echo-api.request.debug-invoke-0001",
              "locale": "de-DE",
              "timestamp": "2026-09-13T19:00:00Z",
              "intent": {
                "name": "GptQueryIntent",
                "slots": {"query": {"name": "query", "value": "wie ist der hausstatus"}}
              }
            }
          }
          json.dump(req, open("/tmp/req.json", "w"))
          PYEOF
          echo "=== aws lambda invoke ==="
          set +e
          OUT=$(aws lambda invoke --function-name meinhelfer-alexa \
            --cli-binary-format raw-in-base64-out \
            --payload "file:///tmp/req.json" \
            /tmp/response.json --log-type Tail 2>/tmp/inv.err)
          RC=$?
          echo "exit: ${RC}"
          echo "--- stderr ---"
          cat /tmp/inv.err
          echo "--- logs (APL-DIAG/ERROR aus LogResult) ---"
          OUT="$OUT" python3 - <<'PYEOF2'
          import os, json, base64
          try:
              d = json.loads(os.environ["OUT"])
              log = base64.b64decode(d.get("LogResult") or "").decode("utf-8", "replace")
              for line in log.splitlines():
                  if any(k in line for k in ("APL-DIAG", "ERROR", "Traceback")):
                      print(line)
          except Exception:
              print("(kein LogResult)")
          PYEOF2
          echo "--- response.json ---"
          head -c 1500 /tmp/response.json 2>/dev/null
          echo ""
          echo "--- response-summary (Directives/Commands/Transformers) ---"
          python3 - <<'PYEOF3'
          import json
          try:
              resp = json.load(open("/tmp/response.json"))
              r = resp.get("response", {})
              print("outputSpeech:", "vorhanden" if r.get("outputSpeech") else "NICHT VORHANDEN (APL-only-Modus)")
              print("shouldEndSession:", r.get("shouldEndSession"))
              for d in r.get("directives", []):
                  t = d.get("type", "?")
                  if t == "Alexa.Presentation.APL.RenderDocument":
                      ds = d.get("datasources", {}).get("documentData", {})
                      print(f"Directive: {t} | token={d.get('token')}")
                      print("  transformers:", json.dumps(ds.get("transformers", [])))
                      print("  datasource-keys:", list(ds.keys()))
                  elif t == "Alexa.Presentation.APL.ExecuteCommands":
                      print(f"Directive: {t} | token={d.get('token')} | commands={json.dumps(d.get('commands', []))}")
                  else:
                      print(f"Directive: {t}")
          except Exception as e:
              print("Summary-Fehler:", e)
          PYEOF3