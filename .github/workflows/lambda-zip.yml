name: Build Lambda Zip

# Baut die Deployment-Zips der Alexa-Lambda.
# - Push auf main, wenn sich alexa/lambda/** aendert -> Zips als Actions-Artifacts
#   und Rollen-Release "latest" (stabile Anwender-Links:
#   releases/download/latest/meinhelfer-alexa-lambda.zip   (eigene AWS-Lambda)
#   releases/download/latest/meinhelfer-alexa-hosted.zip   (Alexa-hosted Import))
# - Push eines Tags v* -> zusaetzlich GitHub-Release mit den Zips als Assets
# - workflow_call: Wiederverwendung durch deploy-aws-lambda.yml
# WICHTIG: Das Hosted-Zip enthaelt bewusst KEIN config.json (kein Token in
# oeffentlichen Release-Assets); config.json legt der Nutzer nach dem Import an.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'alexa/lambda/**'
      - '.github/workflows/lambda-zip.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten sammeln
        run: |
          rm -rf build
          mkdir -p build
          python -m pip install --quiet --no-compile --target build -r alexa/lambda/requirements.txt

      - name: Zip bauen (nur Funktion + Abhaengigkeiten)
        run: |
          cp alexa/lambda/lambda_function.py build/
          ( cd build && zip -r -q ../meinhelfer-alexa-lambda.zip . -x '*/__pycache__/*' '*.pyc' )
          echo "=== Inhalt (Auszug) ==="
          unzip -l meinhelfer-alexa-lambda.zip | head -20
          echo "=== Groesse ==="
          du -h meinhelfer-alexa-lambda.zip

      - name: Hosted-Zip bauen (lambda/ fuer Alexa-hosted Import)
        run: |
          rm -rf hosted
          mkdir -p hosted/lambda
          cp alexa/lambda/lambda_function.py hosted/lambda/
          cp alexa/lambda/requirements.txt hosted/lambda/
          cp alexa/lambda/config.json.example hosted/lambda/
          # Kein config.json: Das Asset ist oeffentlich, der Token gehoert nicht hinein.
          ( cd hosted && zip -r -q ../meinhelfer-alexa-hosted.zip lambda -x '*/__pycache__/*' '*.pyc' )
          echo "=== Inhalt ==="
          unzip -l meinhelfer-alexa-hosted.zip
          echo "=== Groesse ==="
          du -h meinhelfer-alexa-hosted.zip

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: meinhelfer-alexa-lambda
          path: meinhelfer-alexa-lambda.zip
          retention-days: 30

      - name: Hosted-Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: meinhelfer-alexa-hosted
          path: meinhelfer-alexa-hosted.zip
          retention-days: 30

      - name: Rolling release "latest" aktualisieren
        if: >-
          (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          make_latest: true
          files: |
            meinhelfer-alexa-lambda.zip
            meinhelfer-alexa-hosted.zip

      - name: Release-Asset anhaengen (Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            meinhelfer-alexa-lambda.zip
            meinhelfer-alexa-hosted.zip