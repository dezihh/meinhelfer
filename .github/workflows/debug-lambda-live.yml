name: Debug Lambda->Gateway Live

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Lambda-Env pruefen (nur Schluesselnamen, Werte maskiert)
        run: |
          aws lambda get-function-configuration --function-name smartpilot-alexa --query 'Configuration.Environment.Variables' --output json | python3 -c '
          import json,sys
          v = json.load(sys.stdin) or {}
          for k in sorted(v):
              val = v[k]
              shown = "<leer>" if not val else ("***mask***" if "token" in k or "url" in k or k in ("gateway_token","gateway_url") else val)
              print(f"{k} = {shown}")
          '

      - name: Gateway direkt testen (Token nur im Header, nie loggen)
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          BASE="${GATEWAY_URL%/}"
          echo "Gateway-Base: ${BASE%/} (Secret-Wert wird in Logs maskiert)"
          echo "=== URLs vorhanden? ==="
          curl -s -o /dev/null -w "/api/query  -> %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${GATEWAY_TOKEN}" -H "Content-Type: application/json" \
            -d '{"sessionId":"debug-$(date +%s)","text":"wie ist der hausstatus"}' \
            --max-time 40 "${BASE}/api/query" || echo "api/query FEHLGESCHLAGEN (curl exit $?)"
          curl -s --max-time 10 -o /dev/null -w "/            -> %{http_code}\n" "${BASE}/" || echo "Root-Check fehlgeschlagen"
          echo "=== Response-Body (gekuerzt, Token-frei) ==="
          curl -s -X POST -H "Authorization: Bearer ${GATEWAY_TOKEN}" -H "Content-Type: application/json" \
            -d '{"sessionId":"debug-body","text":"wie ist der hausstatus"}' \
            --max-time 40 "${BASE}/api/query" | head -c 800
          echo ""