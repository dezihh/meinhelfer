name: Debug Lambda Logs (CloudWatch)

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Letzte Lambda-Log-Events (Fehler + Query-Log) holen
        run: |
          set +e
          ARN="arn:aws:lambda:${AWS_DEFAULT_REGION:-eu-west-1}:$(aws sts get-caller-identity --query Account --output text):function:meinhelfer-alexa"
          echo "Log-ARN: ${ARN}"
          echo "=== aws logs CLI verfuegbar? ==="
          aws logs help 2>&1 | head -20 ; echo "(exit $?)"
          echo "=== get-log-events ==="
          aws logs get-log-events --log-source-arn "${ARN}" --limit 120 \
            --output json 2>/tmp/logs.err > /tmp/events.json
          RC=$?
          echo "aws logs exit: ${RC}"
          echo "--- stderr: ---"
          cat /tmp/logs.err
          echo "--- events.json (erste 300 Zeichen): ---"
          head -c 300 /tmp/events.json
          echo ""
          echo "=== fallback: cloudwatch-Loggruppe direkt ==="
          aws cloudwatch get-log-events --log-group-name "/aws/lambda/meinhelfer-alexa" --limit 120 2>&1 | head -c 2000
          echo ""