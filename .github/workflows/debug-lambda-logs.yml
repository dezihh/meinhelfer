name: Debug Lambda Logs (CloudWatch)

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Gateway direkt testen (extern → Gateway erreichbar + Token gueltig?)
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          set +e
          BASE="${GATEWAY_URL%/}"
          echo "=== POST ${BASE}/api/query (extern) ==="
          curl -s -o /tmp/gw.json -w "HTTP %{http_code} in %{time_total}s\n" -X POST \
            -H "Authorization: Bearer ${GATEWAY_TOKEN}" -H "Content-Type: application/json" \
            -d '{"sessionId":"ci-ext-$(date +%s)","text":"wie ist der hausstatus"}' \
            --max-time 60 "${BASE}/api/query"
          head -c 400 /tmp/gw.json
          echo ""
          echo "=== GET ${BASE} (Basis erreichbar?) ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "${BASE}/"

      - name: CloudWatch-Logs unserer Lambda (Streams auflisten + lesen)
        run: |
          set +e
          GROUP="/aws/lambda/smartpilot-alexa"
          echo "Log-Gruppe: ${GROUP}"
          echo "=== describe-log-groups ==="
          aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/smartpilot" --query 'logGroups[].logGroupName' --output json 2>&1 | head -c 800
          echo ""
          echo "=== Letzte Events (filter, 40 Zeilen) ==="
          aws logs filter-log-events --log-group-name "${GROUP}" --query 'events[].message' --output text 2>&1 | tail -40