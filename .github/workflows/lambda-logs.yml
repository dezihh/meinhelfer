name: Lambda-Logs abrufen
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Rueckblick in Minuten"
        default: "15"
      keyword:
        description: "Filter (leer = alles)"
        default: ""

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: AWS-Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}
      - name: Letzte Logs holen
        run: |
          SINCE=$(date -u -d "${{ github.event.inputs.minutes }} minutes ago" '+%Y-%m-%dT%H:%M:%SZ')
          echo "Alle Log-Gruppen:"
          aws logs describe-log-groups --query 'logGroups[].logGroupName' --output text 2>&1 || true
          GROUP="/aws/lambda/smartpilot-alexa"
          echo "----- $GROUP seit $SINCE -----"
          aws logs filter-log-events --log-group-name "$GROUP" --start-time $(date -u -d "${{ github.event.inputs.minutes }} minutes ago" +%s000) --query 'events[].message' --output text 2>&1 | grep -E "\[(INFO|WARNING|ERROR)\]|Traceback|Exception" | tail -60
